# Nginx — baptiste-niszczota.com
# Copier dans : /etc/nginx/sites-available/titisite
# Puis : sudo ln -s /etc/nginx/sites-available/titisite /etc/nginx/sites-enabled/

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name baptiste-niszczota.com www.baptiste-niszczota.com;
    return 301 https://baptiste-niszczota.com$request_uri;
}

# ── HTTPS principal ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name baptiste-niszczota.com www.baptiste-niszczota.com;

    # Certificat Let's Encrypt (généré par certbot)
    ssl_certificate     /etc/letsencrypt/live/baptiste-niszczota.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baptiste-niszczota.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # www → non-www
    if ($host = www.baptiste-niszczota.com) {
        return 301 https://baptiste-niszczota.com$request_uri;
    }

    # Taille de corps par défaut : 10 Mo. Les routes d'upload qui ont besoin
    # de plus (builds 1,2 Go, audio 100 Mo, documents 50 Mo) ont chacune leur
    # propre limite dans leur bloc location — un endpoint quelconque ne peut
    # plus recevoir un corps géant.
    client_max_body_size 10M;

    # Timeouts généreux pour les gros uploads
    proxy_read_timeout  1800s;
    proxy_send_timeout  1800s;
    proxy_connect_timeout 60s;

    # Compression Gzip (Nginx compresse mieux qu'Express)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml font/woff2;

    # ── URLs portant un secret dans le chemin : ne jamais logger l'URL ─────
    # iCal (token), feed cockpit Minefield (token, pollé en boucle → sinon des
    # centaines de lignes/jour dans access.log), et les liens de partage scopés
    # WorldEdit / blueprints. Une lecture des logs (backup, incident, admin sys)
    # suffirait sinon à récupérer une capacité encore active.
    #   « error_log off » créerait un fichier nommé « off » : la façon correcte
    #   de couper les erreurs (qui incluent l'URL, donc le token) est /dev/null.
    location ~ ^/api/(calendar/|quests/cockpit/|worldedit/shared/|blueprints/shared/) {
        access_log off;
        error_log  /dev/null crit;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Upload de builds de jeu : seul endpoint autorisé à 1,2 Go ──────────
    location ~ ^/api/workspaces/[^/]+/builds {
        client_max_body_size 1200M;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Upload audio (pistes, 100 Mo côté multer) ──────────────────────────
    location /api/tracks {
        client_max_body_size 120M;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Upload d'images (40 Mo côté multer — panoramas) ────────────────────
    location /api/images {
        client_max_body_size 50M;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Upload de documents (50 Mo côté multer) ────────────────────────────
    location ~ ^/api/workspaces/[^/]+/documents {
        client_max_body_size 60M;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Import de mondes Minecraft .mca / ZIP region (512 Mo côté multer) ──
    # Sans ce bloc, l'upload retombait sur le « location / » par défaut (10 Mo)
    # et les vrais imports échouaient en 413. La décompression est bornée côté
    # serveur (maxOutputLength + worker resourceLimits), donc relever la limite
    # ici ne rouvre pas la surface zip-bomb.
    location ~ ^/api/workspaces/[^/]+/blueprints {
        client_max_body_size 512M;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Proxy vers Express ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
